# ==============================================================================
# HYPRLAND CONFIGURATION FOR BIRUK-OS HACKER EDITION
# Pure Wayland Tiling Window Manager
# Engineered exclusively for Boss Biruk
# ==============================================================================

# Monitor setup (Auto-detect preferred resolution)
monitor=,preferred,auto,1

# Autostart essential Waybar and 4-Pane Hacker Layout
exec-once = waybar
exec-once = /usr/local/bin/biruk_4pane.sh

# Environment variables
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# General Layout & Neon Glass Aesthetic
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(00ffccaa) rgba(ff0077aa) 45deg
    col.inactive_border = rgba(14203daa)

    layout = dwindle
    allow_tearing = false
}

# Glass Decorations & Rounded Corners
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }

    drop_shadow = true
    shadow_range = 14
    shadow_render_power = 3
    col.shadow = rgba(070b14dd)
}

# Smooth Animations
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, default
}

# Dwindle Layout Specifics (enables 4-pane tiling)
dwindle {
    pseudotile = true
    preserve_split = true
}

# Disable all screen blanking / DPMS / Lockers (Screen stays ON)
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
}

# Window Rules for the 4 Panes
windowrulev2 = opacity 0.88 0.82,class:^(kitty)$
windowrulev2 = bordercolor rgba(38bdf8ee) rgba(a855f7ee) 45deg,class:^(hacker_beti)$
windowrulev2 = bordercolor rgba(10b981ee) rgba(38bdf8ee) 45deg,class:^(hacker_cava)$

# Master Keybindings
$mainMod = SUPER

# Launch Applications
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, B, exec, kitty -e python /opt/beti_ai/beti_core.py
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, E, exec, kitty -e nano
bind = $mainMod, I, exec, kitty -e archinstall
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, exit,

# Focus navigation (Arrows)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
