# ==============================================================================
# Kitty Terminal Configuration for Biruk-OS
# GPU-Accelerated, Translucent Glass & Cyber Dark Aesthetic
# ==============================================================================

font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# Glass Blur & Translucency
background_opacity 0.82
background_blur    32
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# Cursor
cursor            #38bdf8
cursor_text_color #070b14
cursor_shape      block
cursor_blink_interval 0.5

# Cyber Neon Color Scheme
background #070b14
foreground #f8fafc

# Black
color0 #0d1527
color8 #1e293b

# Red
color1 #f43f5e
color9 #fb7185

# Green
color2  #10b981
color10 #34d399

# Yellow
color3  #f59e0b
color11 #fbbf24

# Blue
color4  #0ea5e9
color12 #38bdf8

# Magenta (Beti AI Purple)
color5  #a855f7
color13 #c084fc

# Cyan
color6  #06b6d4
color14 #22d3ee

# White
color7  #e2e8f0
color15 #ffffff
